name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Build, Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: siteyonet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siteyonet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Install Dependencies
        working-directory: backend
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m ./...

      - name: Apply Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/siteyonet?sslmode=disable
        run: go run ./cmd/migrate/main.go

      - name: Run Go Unit & Integration Tests (with Race Detector)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/siteyonet?sslmode=disable
        run: go test -v -race -coverprofile=coverage.out ./tests/...

      - name: Build Backend Binaries
        working-directory: backend
        run: |
          go build -v -o /tmp/api ./cmd/api
          go build -v -o /tmp/simulator ./cmd/simulator

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build
