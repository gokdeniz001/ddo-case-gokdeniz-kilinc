openapi: 3.0.3
info:
  title: SiteYönet API
  description: Çok kiracılı (multi-tenant) site, apartman ve aidat yönetim sistemi API dokümantasyonu.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Yerel Geliştirme ve Docker Ortamı

paths:
  /health:
    get:
      summary: Genel Sağlık Kontrolü
      responses:
        '200':
          description: Sistem ve veritabanı sağlıklı

  /_hz/0c7c:
    get:
      summary: DDO Özel Sağlık Ucu
      responses:
        '200':
          description: OK 0c7c

  /api/v1/auth/login:
    post:
      summary: Kullanıcı Girişi ve JWT Üretimi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Başarılı giriş, JWT token döner
        '401':
          description: Hatalı e-posta veya parola

  /api/v1/units:
    get:
      summary: Daire ve Kat Mülkiyeti Bilgilerini Listele
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daire listesi

  /api/v1/accruals:
    post:
      summary: T-1 En Büyük Kalan Yöntemi ile Tahakkuk Dağıtımı
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period_id, title, term_month, distribution_type, total_amount_cents]
              properties:
                period_id:
                  type: string
                  format: uuid
                title:
                  type: string
                term_month:
                  type: string
                  example: "2026-11"
                distribution_type:
                  type: string
                  enum: [LAND_SHARE, EQUAL, AREA_M2, RESIDENT_COUNT]
                total_amount_cents:
                  type: integer
                  description: Kuruş cinsinden toplam gider tutarı
      responses:
        '201':
          description: Tahakkuk ve daire borçları oluşturuldu

  /api/v1/bank-statements/match:
    post:
      summary: T-2 Banka Dekontu Bulanık Eşleştirme (Levenshtein + Regex)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw_description]
              properties:
                raw_description:
                  type: string
                  example: "A BLOK NO: 5 AHMET YILMAZ AIDAT"
      responses:
        '200':
          description: Eşleşen daire ve güven skoru

  /api/v1/payments:
    post:
      summary: T-2 Tahsilat İşleme ve Waterfall Mahsup (Faiz -> Anapara -> FIFO)
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unit_id, amount_cents]
              properties:
                unit_id:
                  type: string
                  format: uuid
                amount_cents:
                  type: integer
      responses:
        '201':
          description: Ödeme tahsis edildi, borçlar güncellendi

  /api/v1/certificates/verify/{code}:
    get:
      summary: T-4 'Borcu Yoktur' Belgesi Kriptografik Doğrulama
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Belge geçerlilik durumu ve SHA-256 hash doğrulaması

  /api/v1/auth/refresh:
    post:
      summary: Refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {"refresh_token": "{{managerLogin.response.body.refresh_token}}"}
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/auth/me:
    get:
      summary: GetMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/auth/site:
    post:
      summary: SwitchSite
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {"site_id": "{{managerLogin.response.body.site.id}}"}
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/sites:
    get:
      summary: ListSites
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/sites/{id}:
    get:
      summary: GetSite
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/blocks:
    get:
      summary: ListBlocks
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied
    post:
      summary: CreateBlock
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {"name": "REST-{{$timestamp}}", "total_floors": 2}
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/units/{id}/transfer:
    post:
      summary: TransferOwnership
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {"new_owner_id": "{{residentLogin.response.body.user.id}}", "transfer_date": "2026-10-11"}
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/dues-definitions:
    get:
      summary: ListDuesDefinitions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied
    post:
      summary: CreateDuesDefinition
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {"name": "REST Aidat", "total_amount_cents": 125433, "distribution_type": "LAND_SHARE", "due_day": 15, "late_fee_rate": 5}
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/accruals/{id}/reverse:
    post:
      summary: ReverseAccrual
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/debts:
    get:
      summary: ListDebts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/debts/restructure:
    post:
      summary: RestructureDebts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/bank-statements:
    get:
      summary: ListBankStatements
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/expenses:
    get:
      summary: ListExpenses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied
    post:
      summary: CreateExpense
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/announcements:
    get:
      summary: ListAnnouncements
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied
    post:
      summary: CreateAnnouncement
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {"title": "REST Duyuru", "content": "Deneme duyurusu", "priority": "NORMAL"}
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
