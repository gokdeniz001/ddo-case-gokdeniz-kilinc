  /api/v1/decisions:
    get:
      summary: ListDecisions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied
    post:
      summary: CreateDecision
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {"decision_number": "REST-{{$timestamp}}", "decision_date": "2026-10-26", "title": "REST Karar", "content": "Deneme kararı", "vote_summary": "Oy birliği"}
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/maintenance:
    get:
      summary: ListMaintenanceRequests
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied
    post:
      summary: CreateMaintenanceRequest
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {"unit_id": "{{firstUnitId}}", "title": "REST Bakım", "description": "Deneme talebi", "priority": "MEDIUM"}
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/maintenance/{id}/status:
    put:
      summary: UpdateMaintenanceStatus
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {"status": "IN_PROGRESS"}
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/periods:
    get:
      summary: ListFiscalPeriods
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied
    post:
      summary: CreateFiscalPeriod
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {"name": "REST Deneme Dönemi", "start_date": "2999-01-01", "end_date": "2999-12-31"}
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/periods/{id}/close:
    post:
      summary: CloseFiscalPeriod
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/ledger-accounts:
    get:
      summary: ListLedgerAccounts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/journal-entries:
    get:
      summary: ListJournalEntries
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied
    post:
      summary: CreateJournalEntry
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {"period_id": "{{periodId}}", "entry_date": "2026-10-26", "description": "REST Fiş", "lines": [{"AccountID": "{{getLedgerAccounts.response.body.0.id}}", "DebitCents": 100}, {"AccountID": "{{getLedgerAccounts.response.body.1.id}}", "CreditCents": 100}]}
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/journal-entries/{id}/reverse:
    post:
      summary: ReverseJournalEntry
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/reports/summary:
    get:
      summary: GetFinancialSummary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/reports/budget-comparison:
    get:
      summary: GetBudgetComparison
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/budgets:
    post:
      summary: SaveBudget
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {"category": "CLEANING", "amount_cents": 2000000}
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/reports/reconciliation:
    get:
      summary: Reconciliation
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/certificates:
    get:
      summary: ListCertificates
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied
    post:
      summary: IssueClearanceCertificate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/audit-logs:
    get:
      summary: ListAuditLogs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Permission denied

  /api/v1/bank-statements/import:
    post:
      summary: CSV banka ekstresini içe aktar ve daireleri eşleştir
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv:
                  type: string
                  description: "date,reference,description,amount_cents başlıklı CSV metni"
      responses:
        '201':
          description: İçeri alınan, eşleşen ve eşleşmeyen satır sayıları
        '400':
          description: Tarih, tam sayı kuruş tutarı veya CSV başlığı geçersiz
        '403':
          description: Yönetici veya muhasebe rolü gerekli

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
